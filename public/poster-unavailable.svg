<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131a24"/>
      <stop offset="100%" stop-color="#0b1019"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="300" height="450" rx="24" fill="url(#bg)"/>
  <rect x="18" y="18" width="264" height="414" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <g filter="url(#glow)" stroke="#ff4b4b" stroke-width="10" stroke-linecap="round">
    <line x1="90" y1="160" x2="210" y2="280"/>
    <line x1="210" y1="160" x2="90" y2="280"/>
  </g>
  <text x="150" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="2" fill="#ff7b7b">
    POSTER UNAVAILABLE
  </text>
</svg>
